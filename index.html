    <style>
      #preload {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #0b1220;
        transition: opacity 600ms ease, visibility 600ms ease;
      }
      #preload.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      #preload img {
        height: 80px;
        width: auto;
        animation: preloadPulse 2s ease-in-out infinite;
      }
      #preload p {
        font-family: 'Montserrat', sans-serif;
        font-size: 1.125rem;
        font-weight: 500;
        color: #ffffff;
        text-align: center;
        max-width: 320px;
        line-height: 1.5;
        opacity: 0.9;
      }
      @keyframes preloadPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
    </style>
  </head>
